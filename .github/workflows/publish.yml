name: Publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - run: composer validate --strict
      - run: find src -name '*.php' | xargs php -l
      - name: Notify Packagist
        # Packagist webhook is already configured via GitHub webhook on this repo.
        # This step just confirms the release is valid before Packagist auto-updates.
        run: echo "Release ${{ github.event.release.tag_name }} validated — Packagist webhook will auto-update."
